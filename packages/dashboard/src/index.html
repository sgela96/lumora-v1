<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumora</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g'><stop offset='0' stop-color='%23fff'/><stop offset='.35' stop-color='%23FFF3CF'/><stop offset='.7' stop-color='%23FFD666' stop-opacity='.8'/><stop offset='1' stop-color='%23FFD666' stop-opacity='0'/></radialGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/></svg>" />

      try { document.documentElement.dataset.theme = localStorage.getItem('lumora-theme') === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="stylesheet" href="./styles.css" />
